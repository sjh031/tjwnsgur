<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 및 로그인 - 쇼핑몰 스타일</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f2f2f2;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .form-card {
            background-color: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            max-width: 100%;
            text-align: center;
        }

        h1 {
            color: #3498db;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #555;
            text-align: left;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        .input-group i {
            font-size: 18px;
            color: #3498db;
            margin-left: 10px;
        }

        input:focus {
            background-color: #fff;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .footer {
            font-size: 14px;
            margin-top: 15px;
            color: #777;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .message {
            margin-top: 20px;
            font-size: 16px;
            text-align: center;
            color: #e74c3c;
        }

        /* 쇼핑몰 스타일 */
        #shop-page {
            display: none;
            padding: 20px;
            text-align: center;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #3498db;
            color: white;
            padding: 15px;
        }

        .cart-icon {
            font-size: 18px;
            cursor: pointer;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .product-card {
            background-color: white;
            width: 200px;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 10px 0;
        }

        .product-card p {
            font-size: 14px;
            color: #555;
        }

        .product-card button {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .product-card button:hover {
            background-color: #2980b9;
        }

        .cart {
            display: inline-block;
            font-size: 18px;
            cursor: pointer;
            background-color: #2980b9;
            padding: 10px 20px;
            border-radius: 5px;
        }

    </style>
</head>
<body>

    <div class="container" id="signup-form">
        <div class="form-card">
            <h1>회원가입</h1>

            <label for="new-username">아이디</label>
            <div class="input-group">
                <input type="text" id="new-username" placeholder="아이디를 입력하세요">
                <i class="fas fa-user"></i>
            </div>

            <label for="new-password">비밀번호</label>
            <div class="input-group">
                <input type="password" id="new-password" placeholder="비밀번호를 입력하세요">
                <i class="fas fa-lock"></i>
            </div>

            <div class="buttons">
                <button onclick="registerUser()">회원가입</button>
            </div>

            <div class="footer">
                <p>이미 계정이 있으신가요? <a href="javascript:void(0)" onclick="showLoginForm()">로그인</a></p>
            </div>
        </div>
    </div>

    <div class="container" id="login-form" style="display: none;">
        <div class="form-card">
            <h1>로그인</h1>

            <label for="username">아이디</label>
            <div class="input-group">
                <input type="text" id="username" placeholder="아이디를 입력하세요">
                <i class="fas fa-user"></i>
            </div>

            <label for="password">비밀번호</label>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                <i class="fas fa-lock"></i>
            </div>

            <div class="buttons">
                <button onclick="loginUser()">로그인</button>
            </div>

            <div id="error-message" class="message" style="display: none;">
                <p>아이디 또는 비밀번호가 잘못되었습니다. 다시 시도해 주세요.</p>
            </div>

            <div class="footer">
                <p>아직 회원이 아니신가요? <a href="javascript:void(0)" onclick="showSignupForm()">회원가입</a></p>
            </div>
        </div>
    </div>

    <div id="welcome-message" class="container" style="display: none;">
        <div class="form-card">
            <h1>환영합니다!</h1>
            <p>안녕하세요, <span id="user-name"></span>님! 쇼핑을 시작하세요.</p>
            <button onclick="startShopping()">쇼핑 시작</button>
        </div>
    </div>

    <div id="shop-page" class="container">
        <div class="shop-header">
            <div>
                <h1>가상 쇼핑몰</h1>
            </div>
            <div>
                <span id="cart-count" class="cart-icon">장바구니(0)</span>
            </div>
        </div>

        <div class="product-list">
            <div class="product-card">
                <img src="https://via.placeholder.com/200x150" alt="상품 이미지">
                <h3>상품 1</h3>
                <p>가격: 10,000원</p>
                <button onclick="addToCart('상품 1')">장바구니에 담기</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/200x150" alt="상품 이미지">
                <h3>상품 2</h3>
                <p>가격: 20,000원</p>
                <button onclick="addToCart('상품 2')">장바구니에 담기</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/200x150" alt="상품 이미지">
                <h3>상품 3</h3>
                <p>가격: 15,000원</p>
                <button onclick="addToCart('상품 3')">장바구니에 담기</button>
            </div>
        </div>
    </div>

    <script>
        let userDatabase = {};
        let cart = [];

        // 회원가입 처리 함수
        function registerUser() {
            const newUsername = document.getElementById("new-username").value;
            const newPassword = document.getElementById("new-password").value;

            if (newUsername && newPassword) {
                userDatabase[newUsername] = newPassword;
                showLoginForm();
            } else {
                alert("아이디와 비밀번호를 모두 입력해주세요.");
            }
        }

        // 로그인 처리 함수
        function loginUser() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (userDatabase[username] && userDatabase[username] === password) {
                document.getElementById("login-form").style.display = "none";
                document.getElementById("welcome-message").style.display = "block";
                document.getElementById("user-name").textContent = username;
                document.getElementById("error-message").style.display = "none";
            } else {
                document.getElementById("error-message").style.display = "block";
            }
        }

        // 쇼핑 시작
        function startShopping() {
            document.getElementById("welcome-message").style.display = "none";
            document.getElementById("shop-page").style.display = "block";
        }

        // 장바구니에 상품 추가
        function addToCart(product) {
            cart.push(product);
            document.getElementById("cart-count").textContent = `장바구니(${cart.length})`;
        }

        // 로그아웃
        function logout() {
            document.getElementById("shop-page").style.display = "none";
            showLoginForm();
        }

        // 로그인 화면 보이기
        function showLoginForm() {
            document.getElementById("signup-form").style.display = "none";
            document.getElementById("login-form").style.display = "block";
        }

        // 회원가입 화면 보이기
        function showSignupForm() {
            document.getElementById("login-form").style.display = "none";
            document.getElementById("signup-form").style.display = "block";
        }
    </script>

</body>
</html>
